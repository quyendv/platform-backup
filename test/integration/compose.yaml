# Real targets plus a real S3 implementation. Nothing here is mocked: the point
# is to prove backup -> fetch -> restore round-trips actual data.
name: platform-backup-it

services:
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: appdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 2s
      timeout: 3s
      retries: 30

  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secret
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Raft storage, not `vault server -dev`: dev mode uses in-memory storage and
  # has no raft snapshots to take.
  vault:
    image: hashicorp/vault:1.18
    cap_add: [IPC_LOCK]
    # A fresh named volume is root-owned, and the image's entrypoint drops to
    # uid 100 on its own. Start as root only long enough to chown the mount,
    # then hand over to the normal entrypoint.
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - chown -R vault:vault /vault/data && exec docker-entrypoint.sh server
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_LOCAL_CONFIG: |
        storage "raft" { path = "/vault/data", node_id = "it" }
        listener "tcp" { address = "0.0.0.0:8200", tls_disable = true }
        api_addr = "http://vault:8200"
        cluster_addr = "http://vault:8201"
        disable_mlock = true
    healthcheck:
      # `vault status` exits 2 while sealed, which is a healthy API here.
      test: ["CMD-SHELL", "vault status >/dev/null 2>&1 || [ $$? -eq 2 ]"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      # raft needs a real directory; the image ships none.
      - vault_data:/vault/data

volumes:
  vault_data:
