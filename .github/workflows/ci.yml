name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  # Re-run against the current HEAD without an empty commit.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a pull request run is free; superseding a push to a branch is
  # not, because that run publishes images. Two quick pushes to main would
  # otherwise leave the newer commit's images unbuilt.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, format and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      # The same command developers run locally, with the same pinned tools.
      - run: mise run check

  changes:
    name: Detect affected backends
    runs-on: ubuntu-latest
    outputs:
      backends: ${{ steps.matrix.outputs.backends }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared:
              - 'lib/**'
              - 'entrypoint.sh'
              - 'docker-bake.hcl'
              - '.github/workflows/**'
            postgresql:
              - 'backends/postgresql/**'
            mongodb:
              - 'backends/mongodb/**'
            etcd:
              - 'backends/etcd/**'
            vault:
              - 'backends/vault/**'
      - id: matrix
        env:
          # Read each filter's own boolean output. The combined `changes`
          # output is already a JSON string, and wrapping it in toJSON() double
          # encodes it into "[]", which jq cannot iterate.
          SHARED: ${{ steps.filter.outputs.shared }}
          POSTGRESQL: ${{ steps.filter.outputs.postgresql }}
          MONGODB: ${{ steps.filter.outputs.mongodb }}
          ETCD: ${{ steps.filter.outputs.etcd }}
          VAULT: ${{ steps.filter.outputs.vault }}
        run: |
          set -euo pipefail
          # A change under lib/ or the bake file reaches every image, so it
          # rebuilds all four; otherwise only the backends that changed.
          selected=()
          for backend in postgresql mongodb etcd vault; do
            var="${backend^^}"
            if [ "$SHARED" = "true" ] || [ "${!var}" = "true" ]; then
              selected+=("$backend")
            fi
          done
          backends=$(jq -cn '$ARGS.positional' --args ${selected[@]+"${selected[@]}"})
          echo "backends=$backends" >> "$GITHUB_OUTPUT"
          echo "Building: $backends"

  build:
    name: Build ${{ matrix.backend }}
    needs: [check, changes]
    if: needs.changes.outputs.backends != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(needs.changes.outputs.backends) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only here. Emulated arm64 is slow and the postgres matrix
      # multiplies it by four, so it is left to the release workflow.
      - name: Build
        uses: docker/bake-action@v7
        with:
          targets: ${{ matrix.backend }}
          push: ${{ github.event_name == 'push' }}
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha,scope=${{ matrix.backend }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.backend }}
