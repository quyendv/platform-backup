name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, format and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # The same command developers run locally, with the same pinned tools.
      - run: mise run check

  changes:
    name: Detect affected backends
    runs-on: ubuntu-latest
    outputs:
      backends: ${{ steps.matrix.outputs.backends }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'lib/**'
              - 'entrypoint.sh'
              - 'docker-bake.hcl'
              - '.github/workflows/**'
            postgresql:
              - 'backends/postgresql/**'
            mongodb:
              - 'backends/mongodb/**'
            etcd:
              - 'backends/etcd/**'
            vault:
              - 'backends/vault/**'
      - id: matrix
        env:
          SHARED: ${{ steps.filter.outputs.shared }}
          CHANGED: ${{ toJSON(steps.filter.outputs.changes) }}
        run: |
          # A change under lib/ or the bake file reaches every image, so it
          # rebuilds all four; otherwise only the backends that changed.
          if [ "$SHARED" = "true" ]; then
            backends='["postgresql","mongodb","etcd","vault"]'
          else
            backends=$(echo "$CHANGED" | jq -c '[.[] | select(. != "shared")]')
          fi
          echo "backends=$backends" >> "$GITHUB_OUTPUT"
          echo "Building: $backends"

  build:
    name: Build ${{ matrix.backend }}
    needs: [check, changes]
    if: needs.changes.outputs.backends != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(needs.changes.outputs.backends) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only here. Emulated arm64 is slow and the postgres matrix
      # multiplies it by four, so it is left to the release workflow.
      - name: Build
        uses: docker/bake-action@v5
        with:
          targets: ${{ matrix.backend }}
          push: ${{ github.event_name == 'push' }}
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha,scope=${{ matrix.backend }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.backend }}
