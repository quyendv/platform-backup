name: Release

# Backends release independently: tag postgresql/v1.2.0 to ship only that image.
on:
  push:
    tags: ['*/v*']
  workflow_dispatch:
    inputs:
      backend:
        description: Backend to build
        required: true
        type: choice
        options: [postgresql, mongodb, etcd, vault]

permissions:
  contents: read

jobs:
  release:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve backend and version from the tag
        id: meta
        env:
          REF: ${{ github.ref_name }}
          DISPATCH_BACKEND: ${{ inputs.backend }}
        run: |
          set -euo pipefail
          if [ -n "$DISPATCH_BACKEND" ]; then
            backend="$DISPATCH_BACKEND"
            version="dev"
          else
            backend="${REF%%/*}"
            version="${REF##*/v}"
          fi
          case "$backend" in
            postgresql|mongodb|etcd|vault) ;;
            *) echo "::error::Unknown backend '$backend' in tag '$REF'"; exit 1 ;;
          esac
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch
        uses: docker/bake-action@v5
        env:
          TAG: ${{ steps.meta.outputs.version }}
          PLATFORMS: linux/amd64,linux/arm64
        with:
          targets: ${{ steps.meta.outputs.backend }}
          push: true
          set: |
            *.cache-from=type=gha,scope=${{ steps.meta.outputs.backend }}
            *.cache-to=type=gha,mode=max,scope=${{ steps.meta.outputs.backend }}
