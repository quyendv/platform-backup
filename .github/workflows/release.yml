name: Release

# Two tag shapes, on purpose:
#
#   v0.1.0              releases every backend at one version
#   postgresql/v1.2.0   releases a single backend on its own cadence
#
# The repo-wide form is what early versions use, while one shared lib/ means
# the four images really do move together. The per-backend form is there for
# when they stop doing that.
on:
  push:
    tags:
      - 'v*'
      - '*/v*'
  workflow_dispatch:
    inputs:
      backend:
        description: Backend to build
        required: true
        default: all
        type: choice
        options: [all, postgresql, mongodb, etcd, vault, redis]
      version:
        description: Version to tag the images with
        required: true
        default: dev

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      backends: ${{ steps.parse.outputs.backends }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        env:
          REF: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          INPUT_BACKEND: ${{ inputs.backend }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          all='["postgresql","mongodb","etcd","vault","redis"]'

          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            if [ "$INPUT_BACKEND" = "all" ]; then
              backends="$all"
            else
              backends=$(jq -cn --arg b "$INPUT_BACKEND" '[$b]')
            fi
          elif [ "${REF#*/}" = "$REF" ]; then
            # No slash: a repo-wide tag such as v0.1.0.
            version="${REF#v}"
            backends="$all"
          else
            name="${REF%%/*}"
            case "$name" in
              postgresql|mongodb|etcd|vault|redis) ;;
              *) echo "::error::Unknown backend '$name' in tag '$REF'"; exit 1 ;;
            esac
            version="${REF##*/v}"
            backends=$(jq -cn --arg b "$name" '[$b]')
          fi

          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            dev) ;;
            *) echo "::error::Version '$version' is not semver"; exit 1 ;;
          esac

          echo "backends=$backends" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $backends at $version"

  release:
    name: Build and push ${{ matrix.backend }}
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJSON(needs.resolve.outputs.backends) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The only place arm64 is published: emulated builds are slow and the
      # postgres matrix multiplies that by four.
      - name: Build and push multi-arch
        uses: docker/bake-action@v7
        env:
          TAG: ${{ needs.resolve.outputs.version }}
          PLATFORMS: linux/amd64,linux/arm64
        with:
          targets: ${{ matrix.backend }}
          push: true
          set: |
            *.cache-from=type=gha,scope=${{ matrix.backend }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.backend }}
