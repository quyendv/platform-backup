# Scheduled etcd backup.
#
# etcd runs on the control plane, listens on the host network, and its client
# certificates live on the host filesystem — so unlike the other backends this
# pod is pinned to a control-plane node and mounts those paths directly.
#
# One Secret rather than a ConfigMap alongside it: splitting them only buys
# anything if RBAC separates who may read config from who may read credentials,
# or if an external secret manager owns the Secret. Otherwise it is a second
# object to keep in sync, and it puts the bucket and endpoint somewhere that is
# usually readable by more principals.
---
apiVersion: v1
kind: Secret
metadata:
  name: etcd-backup
  namespace: kube-system
type: Opaque
stringData:
  # ── etcd ───────────────────────────────────────────────────────────────────
  # kubeadm reads the standard /etc/kubernetes/pki/etcd paths mounted below.
  ETCD_MODE: "kubeadm"

  # ── Object storage ─────────────────────────────────────────────────────────
  # Read by the AWS CLI itself. Omit both keys entirely to authenticate with an
  # IRSA service account or an instance role instead.
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: "us-east-1"
  # Required for MinIO / Ceph / R2 / Spaces; omit for real AWS.
  AWS_ENDPOINT_URL_S3: "https://minio.example.com"

  # Read by this image.
  S3_BUCKET: "your-bucket"
  S3_PREFIX: "backups/etcd"

  # ── Retention ──────────────────────────────────────────────────────────────
  # Counts, not days. 0 disables pruning on that side. KEEP_LOCAL barely
  # matters here: every run gets a fresh pod, so the local copy is scratch.
  KEEP_LOCAL: "1"
  KEEP_REMOTE: "30"

  # ── Notifications ──────────────────────────────────────────────────────────
  # Leave NOTIFY_ON as "failure": each run is a fresh pod with an emptyDir, so
  # the state file never survives and "previous outcome" is always unknown.
  # "change" would therefore fire on every run, and a recovery message can
  # never be sent — mount a PersistentVolumeClaim at /backup if you want both.
  #
  # Failures always notify regardless, which is the part that matters.
  NOTIFY_ON: "failure"
  # Uncomment the channels you use; several can run at once. A channel that
  # fails is logged and skipped and never changes the backup's outcome.
  # NOTIFY_TELEGRAM_BOT_TOKEN: ""
  # NOTIFY_TELEGRAM_CHAT_ID: ""
  # NOTIFY_SLACK_WEBHOOK_URL: ""
  # NOTIFY_GOOGLE_CHAT_WEBHOOK_URL: ""
  # NOTIFY_DISCORD_WEBHOOK_URL: ""
  # NOTIFY_WEBHOOK_URL: ""
  # NOTIFY_SMTP_URL: "smtps://user:password@smtp.example.com:465"
  # NOTIFY_SMTP_FROM: "backup@example.com"
  # NOTIFY_SMTP_TO: "ops@example.com"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: kube-system
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # A backup that cannot succeed should surface, not retry all day.
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          hostNetwork: true
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          containers:
            - name: backup
              image: ghcr.io/quyendv/platform-backup/etcd:0.2.0
              imagePullPolicy: Always
              envFrom:
                - secretRef:
                    name: etcd-backup
              securityContext:
                # etcd's server.key is root-readable only.
                runAsUser: 0
              volumeMounts:
                - name: etcd-certs
                  mountPath: /etc/kubernetes/pki/etcd
                  readOnly: true
                - name: backup
                  mountPath: /backup
          volumes:
            - name: etcd-certs
              hostPath:
                path: /etc/kubernetes/pki/etcd
                type: Directory
            # Scratch for this run only. The Job's own status is what reports a
            # failure to the cluster; KEEP_REMOTE is what retains history.
            - name: backup
              emptyDir: {}
