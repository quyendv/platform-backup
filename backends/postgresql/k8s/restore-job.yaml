# One-shot restore for postgresql. Reuses the CronJob's Secret, so the object store
# settings cannot drift between backup and restore.
#
# Set RESTORE_DROP=true to replace the database, or RESTORE_CLEAN=true to clean objects.
# Set RESTORE_CREATE=true to restore database properties under the same name.
# Set RESTORE_NO_OWNER=true to skip archived owners and grants.
#
#   kubectl apply -f backends/postgresql/k8s/restore-job.yaml
#   kubectl logs -f job/postgresql-restore -n <your-namespace>
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgresql-restore
  namespace: <your-namespace>
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: restore
          image: ghcr.io/quyendv/platform-backup/postgresql:0.9.0-pg17
          imagePullPolicy: Always
          env:
            - name: MODE
              value: "restore"
            # Empty selects the newest run; set YYYYMMDD_HHMMSS to pin one.
            - name: RESTORE_TIMESTAMP
              value: ""
            # A restore is deliberate and watched; notifying about it is noise.
            - name: NOTIFY_ON
              value: "never"
          envFrom:
            - secretRef:
                name: postgresql-backup
          volumeMounts:
            - name: restore
              mountPath: /restore
      volumes:
        - name: restore
          emptyDir: {}
