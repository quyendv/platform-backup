# One-shot restore for postgresql. Reuses the CronJob's ConfigMap and Secret, so the
# object store settings cannot drift between backup and restore.
#
# Set RESTORE_DROP=true to drop and recreate the database first, or RESTORE_CLEAN=true to pass --clean --if-exists.
#
#   kubectl apply -f backends/postgresql/k8s/restore-job.yaml
#   kubectl logs -f job/postgresql-restore -n <your-namespace>
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgresql-restore
  namespace: <your-namespace>
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: restore
          image: ghcr.io/quyendv/platform-backup/postgresql:pg17
          imagePullPolicy: Always
          env:
            - name: MODE
              value: "restore"
            # Empty selects the newest run; set YYYYMMDD_HHMMSS to pin one.
            - name: RESTORE_TIMESTAMP
              value: ""
          envFrom:
            - configMapRef:
                name: postgresql-backup-config
            - secretRef:
                name: postgresql-backup-secret
          volumeMounts:
            - name: restore
              mountPath: /restore
      volumes:
        - name: restore
          emptyDir: {}
