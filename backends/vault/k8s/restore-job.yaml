# One-shot restore for vault. Reuses the CronJob's Secret, so the object store
# settings cannot drift between backup and restore.
#
# This replaces the entire Raft state and needs a token far more privileged than
# backup-raft. That token comes from its own Secret, created for this restore
# and deleted after it — never from the backup's agent:
#
#   kubectl -n <your-namespace> create secret generic vault-restore-token \
#     --from-literal=VAULT_TOKEN=<privileged token>
#   kubectl apply -f backends/vault/k8s/restore-job.yaml
#   kubectl logs -f job/vault-restore -n <your-namespace>
#   kubectl -n <your-namespace> delete secret vault-restore-token
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-restore
  namespace: <your-namespace>
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: restore
          image: ghcr.io/quyendv/platform-backup/vault:0.5.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MODE
              value: "restore"
            # Empty selects the newest run; set YYYYMMDD_HHMMSS to pin one.
            - name: RESTORE_TIMESTAMP
              value: ""
            # A restore is deliberate and watched; notifying about it is noise.
            - name: NOTIFY_ON
              value: "never"
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-restore-token
                  key: VAULT_TOKEN
          envFrom:
            - secretRef:
                name: vault-backup
          volumeMounts:
            - name: restore
              mountPath: /restore
      volumes:
        - name: restore
          emptyDir: {}
