# Scheduled mongodb backup. Replace <your-namespace> and fill in the Secret.
#
#   kubectl apply -f backends/mongodb/k8s/cronjob.yaml
#   kubectl create job --from=cronjob/mongodb-backup mongodb-backup-now -n <your-namespace>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-backup-config
  namespace: <your-namespace>
data:
  # MONGODB_URI carries credentials, so it lives in the Secret, not here.
  S3_BUCKET: "your-bucket"
  S3_PREFIX: "backups/mongodb"
  AWS_REGION: "us-east-1"
  # Required for MinIO / Ceph / R2 / Spaces; omit for real AWS.
  AWS_ENDPOINT_URL_S3: "https://minio.example.com"
  # Counts, not days. 0 disables pruning on that side.
  KEEP_LOCAL: "3"
  KEEP_REMOTE: "30"
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-backup-secret
  namespace: <your-namespace>
type: Opaque
stringData:
  MONGODB_URI: "mongodb://user:pass@mongodb.<your-namespace>.svc.cluster.local:27017/?authSource=admin"
  # Omit both keys entirely to authenticate with an IRSA service account.
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodb-backup
  namespace: <your-namespace>
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # A backup that cannot succeed should surface, not retry all day.
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: ghcr.io/quyendv/platform-backup/mongodb:latest
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: mongodb-backup-config
                - secretRef:
                    name: mongodb-backup-secret
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            # Each Job gets a fresh pod, so the local copy is scratch space for
            # this run only; KEEP_REMOTE is what actually retains history.
            - name: backup
              emptyDir: {}
