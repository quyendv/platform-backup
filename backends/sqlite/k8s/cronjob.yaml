# Scheduled sqlite backup. Replace the <placeholders> and fill in the Secret.
#
#   kubectl apply -f backends/sqlite/k8s/cronjob.yaml
#   kubectl create job --from=cronjob/sqlite-backup sqlite-backup-now -n <your-namespace>
#
# The database is a file, so the pod mounts the application's volume,
# read-only. With a ReadWriteOnce volume it must run on the same node as the
# application: the podAffinity below does that. fsGroup gives it the group the application's
# files carry, so it can read them without running as root.
---
apiVersion: v1
kind: Secret
metadata:
  name: sqlite-backup
  namespace: <your-namespace>
type: Opaque
stringData:
  # ── SQLite ─────────────────────────────────────────────────────────────────
  # The database as mounted below (mountPath + file name).
  SQLITE_PATH: "/data/app.db"

  # ── Object storage ─────────────────────────────────────────────────────────
  # Read by the AWS CLI itself. Omit both keys entirely to authenticate with an
  # IRSA service account or an instance role instead.
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: "us-east-1"
  # Required for MinIO / Ceph / R2 / Spaces; omit for real AWS.
  AWS_ENDPOINT_URL_S3: "https://minio.example.com"

  # Read by this image.
  S3_BUCKET: "your-bucket"
  S3_PREFIX: "backups/sqlite"

  # ── Retention ──────────────────────────────────────────────────────────────
  # Counts, not days. 0 disables pruning on that side. KEEP_LOCAL barely
  # matters here: every run gets a fresh pod, so the local copy is scratch.
  KEEP_LOCAL: "1"
  KEEP_REMOTE: "30"

  # ── Notifications ──────────────────────────────────────────────────────────
  # Leave NOTIFY_ON as "failure": each run is a fresh pod with an emptyDir, so
  # the state file never survives and "previous outcome" is always unknown.
  # "change" would therefore fire on every run, and a recovery message can
  # never be sent — mount a PersistentVolumeClaim at /backup if you want both.
  #
  # Failures always notify regardless, which is the part that matters.
  NOTIFY_ON: "failure"
  # Uncomment the channels you use; several can run at once. A channel that
  # fails is logged and skipped and never changes the backup's outcome.
  # NOTIFY_TELEGRAM_BOT_TOKEN: ""
  # NOTIFY_TELEGRAM_CHAT_ID: ""
  # NOTIFY_SLACK_WEBHOOK_URL: ""
  # NOTIFY_GOOGLE_CHAT_WEBHOOK_URL: ""
  # NOTIFY_DISCORD_WEBHOOK_URL: ""
  # NOTIFY_WEBHOOK_URL: ""
  # NOTIFY_SMTP_URL: "smtps://user:password@smtp.example.com:465"
  # NOTIFY_SMTP_FROM: "backup@example.com"
  # NOTIFY_SMTP_TO: "ops@example.com"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sqlite-backup
  namespace: <your-namespace>
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # A backup that cannot succeed should surface, not retry all day.
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            # The group the application's volume is owned by.
            fsGroup: 1000
          affinity:
            # ReadWriteOnce: the volume is attached to one node at a time.
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: <your-app>
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: backup
              image: ghcr.io/quyendv/platform-backup/sqlite:latest
              imagePullPolicy: Always
              envFrom:
                - secretRef:
                    name: sqlite-backup
              volumeMounts:
                # Read-only: SQLite then cannot create a -wal/-shm owned by this
                # pod's user beside the database, which the application could
                # not write. Restore mounts it read-write.
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: backup
                  mountPath: /backup
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: <your-app-data>
            # Scratch for this run only. The Job's own status is what reports a
            # failure to the cluster; KEEP_REMOTE is what retains history.
            - name: backup
              emptyDir: {}
