# Tool versions and task runner for platform-backup.
# CI runs the very same tasks, so a green `mise run check` locally means a green CI.

[tools]
shellcheck = "0.11.0"
shfmt      = "3.14.1"
hadolint   = "2.15.1"
actionlint = "1.7.12"
bats       = "1.14.0"
pre-commit = "4.6.0"
gitleaks   = "8.30.1"
# The sqlite unit tests run real databases. Same release as the image's
# Alpine package, so a test cannot pass on behaviour the image does not have.
sqlite     = "3.49.2"

# Only for `mise run test:k8s`, which proves the offline restore procedure the
# documentation gives actually works on a real cluster.
kind       = "0.33.0"
kubectl    = "1.37.0"
helm       = "4.3.0"

[env]
SHELL_SOURCES = "entrypoint.sh lib backends test"

[tasks.fmt]
description = "Format every shell script in place"
run = "shfmt -w -i 2 -ci $SHELL_SOURCES"

[tasks."fmt:check"]
description = "Fail if any shell script is unformatted"
run = "shfmt -d -i 2 -ci $SHELL_SOURCES"

[tasks."lint:sh"]
description = "shellcheck every shell script, following sourced files"
run = "shellcheck -x -P lib $(shfmt -f $SHELL_SOURCES)"

[tasks."lint:docker"]
description = "hadolint every backend Dockerfile"
run = "hadolint backends/*/Dockerfile"

[tasks."lint:ci"]
description = "actionlint the GitHub workflows"
run = "actionlint"

[tasks."scan:secrets"]
description = "Scan the whole history for committed secrets"
# The pre-commit hook only sees staged changes, and only on clones where
# someone ran `pre-commit install` and did not pass --no-verify. This is the
# copy that actually gates: CI runs it on every push.
run = "gitleaks git --no-banner --redact --verbose ."

[tasks.lint]
description = "All linters"
depends = ["lint:sh", "lint:docker", "lint:ci"]

[tasks.check]
description = "Everything CI runs on a pull request"
depends = ["fmt:check", "lint", "scan:secrets", "test:unit"]

[tasks."test:unit"]
description = "bats unit tests for lib/"
run = "bats --print-output-on-failure test/unit"

[tasks."test:k8s"]
description = "Prove the offline restore runbook on a real kind cluster (~10 min)"
# Applies the manifest the repo ships rather than a copy, so the documented
# procedure cannot rot unnoticed.
run = "test/k8s/run.sh"

[tasks."test:integration"]
description = "End-to-end backup/fetch/restore against MinIO + real targets"
run = "test/integration/run.sh"

[tasks.build]
description = "Build all images for the host architecture"
run = "docker buildx bake --load"

# --- arm64 -------------------------------------------------------------------
# arm64 is not built per-commit; only a release tag builds it, because emulated
# builds are slow. These tasks are how you check it still works before tagging.

[tasks."arm:setup"]
description = "One-off: register arm64 emulation and create the multi-arch builder"
# Registers qemu-aarch64 in the host's binfmt_misc. Undo with:
#   docker run --privileged --rm tonistiigi/binfmt --uninstall qemu-aarch64
run = """
docker run --privileged --rm tonistiigi/binfmt --install arm64
docker buildx inspect pb-arm >/dev/null 2>&1 ||   docker buildx create --name pb-arm --driver docker-container --bootstrap
"""

# arm64 images load under their own name, never over the host-arch tags.
# --load replaces a tag, so testing arm64 used to leave every local image arm64
# until the next `mise run build`, and the integration suite ran on emulation.
[tasks."build:arm"]
description = "Build all images for linux/arm64 as platform-backup-arm64/* (run arm:setup first)"
env = { PLATFORMS = "linux/arm64", REGISTRY = "platform-backup-arm64" }
run = "docker buildx bake --builder pb-arm --load"

[tasks.smoke]
description = "Run every tool inside the built images and check the driver loads"
run = "test/smoke.sh"

[tasks."smoke:arm"]
description = "Same, against the arm64 images"
env = { REGISTRY = "platform-backup-arm64" }
run = "test/smoke.sh --platform linux/arm64"

[tasks."clean:arm"]
description = "Remove the arm64 images build:arm loaded"
# By tag, not by ID: an ID can be shared with an image someone else tagged.
# The pb-arm builder keeps its layer cache, so the next build:arm stays fast.
# raw: mise renders run scripts as Tera templates, which claims docker's {{ }}.
run = "{% raw %}docker image ls --filter 'reference=platform-backup-arm64/*' --format '{{.Repository}}:{{.Tag}}' | xargs -r docker rmi >/dev/null{% endraw %}"

[tasks."verify:arm"]
description = "Build arm64, prove the tooling runs there, then remove the images"
# In order, not as `depends`: mise runs dependencies in parallel, so the smoke
# test ran against the host-arch images while the build was still going,
# failed, and cancelled the build. A failed smoke stops before clean:arm, which
# leaves the images there to debug.
run = ["mise run build:arm", "mise run smoke:arm", "mise run clean:arm"]
